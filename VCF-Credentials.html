<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VCF credentials 2.0</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; color: CanvasText; background: Canvas; }
    main { max-width: 70rem; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.04em; }
    h2 { margin: 0; font-size: 1.2rem; }
    p { margin: .3rem 0; }
    .muted { color: color-mix(in srgb, CanvasText 70%, Canvas); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: end;
      margin: 1.5rem 0 1rem; }
    label { display: grid; gap: .35rem; font-weight: 600; min-width: 0; }
    input, button { font: inherit; }
    input { max-width: 100%; box-sizing: border-box; }
    input[type="search"], button, ::file-selector-button {
      border: 1px solid GrayText; border-radius: .4rem; padding: .35rem .65rem;
    }
    button, ::file-selector-button { cursor: pointer; }
    #components { display: grid; gap: 1rem; margin-top: 1rem; }
    article { border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas);
      border-radius: .75rem; padding: 1rem; overflow-wrap: anywhere; }
    .table { overflow-x: auto; margin-top: .75rem; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: .55rem .5rem; vertical-align: top;
      border-top: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); }
    td:last-child { width: 48%; }
    .secret { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .65rem; }
    code { overflow-wrap: anywhere; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>VCF credentials 2.0</h1>
    </header>
    <div class="toolbar">
      <label>Search <input id="search" type="search" placeholder="Component, hostname, type, or user" disabled></label>
      <button id="show" type="button" disabled>Show all passwords</button>
      <button id="hide" type="button" disabled>Hide all passwords</button>
    </div>
    <p id="status" class="muted" role="status">Loading credentials…</p>
    <section id="components" aria-label="Components"></section>
  </main>
  <script>
    const search = document.querySelector('#search');
    const showAll = document.querySelector('#show');
    const hideAll = document.querySelector('#hide');
    const status = document.querySelector('#status');
    const results = document.querySelector('#components');
    const masked = '••••••••';
    let components = [];

    function updatePasswordButtons() {
      showAll.disabled = !results.querySelector('[data-visible="false"]') &&
        !(search.value && components.some(component => component.credentials.length));
      hideAll.disabled = !results.querySelector('[data-visible="true"]');
    }

    function hostnameLink(hostname) {
      const line = element('p', hostname, 'muted');
      if (!/^[a-z0-9.-]+(?::\d+)?$/i.test(hostname)) return line;
      const link = element('a', hostname);
      try {
        link.href = new URL(`https://${hostname}`).href;
      } catch {
        return line;
      }
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      line.replaceChildren(link);
      return line;
    }

    function element(tag, value, className) {
      const node = document.createElement(tag);
      if (value !== undefined) node.textContent = value;
      if (className) node.className = className;
      return node;
    }

    function parseDeployment(spec) {
      if (!spec || !Array.isArray(spec.hostSpecs)) throw new Error('Invalid deployment format');
      const names = {
        hostSpecs: 'ESXi host',
        vcenterSpec: 'vCenter',
        nsxtSpec: 'NSX',
        sddcManagerSpec: 'SDDC Manager',
        vspClusterSpec: 'VCF Services Platform',
        vcfOperationsSpec: 'VCF Operations',
        vcfOperationsCollectorSpec: 'VCF Operations Collector'
      };
      const groups = new Map();

      function visit(value, path, componentName, hostname = '', group = path) {
        if (Array.isArray(value)) {
          value.forEach((item, index) => visit(item, path + '[' + index + ']', componentName, hostname, group));
          return;
        }
        if (!value || typeof value !== 'object') return;
        const endpoint = value.hostname ?? value.vcenterHostname ?? value.vipFqdn ??
          value.instanceFqdn ?? value.platformFqdn;
        if (typeof endpoint === 'string' && endpoint) {
          hostname = endpoint;
          group = path;
        }
        for (const [key, child] of Object.entries(value)) {
          const fieldPath = path + '.' + key;
          if (/password/i.test(key) && typeof child === 'string' && child.trim()) {
            if (!groups.has(group)) groups.set(group, { componentName, FQDN: hostname, credentials: [] });
            const type = key.replace(/([a-z0-9])([A-Z])/g, '$1 $2');
            const user = typeof value.username === 'string' ? value.username : '—';
            groups.get(group).credentials.push({
              type: type.charAt(0).toUpperCase() + type.slice(1), user, password: child, path: fieldPath
            });
          } else {
            visit(child, fieldPath, componentName, hostname, group);
          }
        }
      }

      for (const [key, value] of Object.entries(spec)) {
        visit(value, key, Object.hasOwn(names, key) ? names[key] : key);
      }
      return [...groups.values()];
    }

    function parseComponents(text) {
      const data = JSON.parse(text.replace(/^\uFEFF/, ''));
      if (data && !Object.hasOwn(data, 'components')) return parseDeployment(data);
      const { components } = data ?? {};
      if (!Array.isArray(components) || !components.every(component =>
        typeof component?.componentName === 'string' &&
        typeof component.FQDN === 'string' &&
        Array.isArray(component.credentials) &&
        component.credentials.every(account =>
          ['type', 'user', 'password'].every(key => typeof account?.[key] === 'string'))
      )) {
        throw new Error('Invalid component format');
      }
      return components;
    }

    function passwordCell(password) {
      const cell = element('td');
      const controls = element('div', undefined, 'secret');
      const value = element('code', masked);
      const toggle = element('button', 'Show');
      toggle.type = 'button';
      const copy = element('button', 'Copy password');
      copy.type = 'button';

      function setVisible(visible) {
        value.textContent = visible ? password : masked;
        toggle.textContent = visible ? 'Hide' : 'Show';
        toggle.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
        toggle.dataset.visible = String(visible);
      }

      setVisible(false);
      toggle.addEventListener('click', () => {
        setVisible(toggle.dataset.visible === 'false');
        updatePasswordButtons();
      });
      copy.addEventListener('click', async () => {
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(password);
          } else {
            function copyToClipboard(event) {
              event.clipboardData.setData('text/plain', password);
              event.preventDefault();
            }
            document.addEventListener('copy', copyToClipboard, { once: true });
            try {
              if (!document.execCommand('copy')) throw new Error('Copy unavailable');
            } finally {
              document.removeEventListener('copy', copyToClipboard);
            }
          }
          status.textContent = 'Password copied to clipboard.';
        } catch {
          status.textContent = 'Could not copy the password to the clipboard.';
        }
      });
      controls.append(value, toggle, copy);
      cell.append(controls);
      return cell;
    }

    function componentCard(component, credentials) {
      const card = element('article');
      card.append(element('h2', component.componentName));
      if (component.FQDN) card.append(hostnameLink(component.FQDN));
      if (!credentials.length) {
        card.append(element('p', 'No credentials listed.', 'muted'));
        return card;
      }

      const container = element('div', undefined, 'table');
      const table = element('table');
      table.setAttribute('aria-label', `${component.componentName} credentials`);
      const header = table.createTHead().insertRow();
      for (const label of ['Type', 'User', 'Password']) {
        const column = element('th', label);
        column.scope = 'col';
        header.append(column);
      }
      const body = table.createTBody();
      for (const { type, user, password, path } of credentials) {
        const label = element('td', type);
        if (path) label.title = path;
        body.insertRow().append(label, element('td', user), passwordCell(password));
      }
      container.append(table);
      card.append(container);
      return card;
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const matches = (...values) => values.some(value => value.toLowerCase().includes(query));
      const cards = [];
      for (const component of components) {
        const componentMatches = matches(component.componentName, component.FQDN);
        const credentials = componentMatches ? component.credentials :
          component.credentials.filter(({ type, user, path = '' }) => matches(type, user, path));
        if (componentMatches || credentials.length) cards.push(componentCard(component, credentials));
      }
      results.replaceChildren(...cards);
      updatePasswordButtons();
      status.textContent = cards.length
        ? `Showing ${cards.length} of ${components.length} components.`
        : query ? 'No components or accounts match your search.' : 'No components in this file.';
    }

    async function loadCredentials() {
      if (location.protocol === 'file:') {
        status.textContent = 'Open this page through a local web server to load VCF-Credentials.json automatically.';
        return;
      }
      try {
        const response = await fetch('./VCF-Credentials.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load credentials');
        components = parseComponents(await response.text());
        search.disabled = !components.length;
        render();
      } catch {
        status.textContent = 'Could not load VCF-Credentials.json. Check that it is beside this page and contains valid credentials JSON.';
      }
    }
    search.addEventListener('input', render);
    showAll.addEventListener('click', () => {
      if (search.value) {
        search.value = '';
        render();
      }
      for (const toggle of results.querySelectorAll('[data-visible="false"]')) toggle.click();
    });
    hideAll.addEventListener('click', () => {
      for (const toggle of results.querySelectorAll('[data-visible="true"]')) toggle.click();
    });
    loadCredentials();
  </script>
</body>
</html>
